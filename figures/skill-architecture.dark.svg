<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 14 965 384" width="965" height="384" role="img" aria-labelledby="t d">
<title id="t">Skill profile architecture</title>
<desc id="d">The agent starts in the middle. It can use six core skills directly and enter three domain trees: Good Writing, Software Engineering and Design. Good Writing routes to five writing leaves. Software Engineering routes by role to eight method leaves, the Road to Glory flow and the Engineering Review parent; Road to Glory runs left to right into review, and Engineering Review applies two lens leaves. Design routes to seven leaves and the Design Review parent, which applies two review leaves. Edges only point down or along a flow.</desc>
