<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 850 368" width="850" height="368" role="img" aria-labelledby="t d">
<title id="t">Good Writing skill family dependencies</title>
<desc id="d">Good Writing is the implicit router. It always prepares material with Writing Fragments, then routes to exactly one of four explicit-only specialists: Customer, Commercial, Workspace and Technical Writing. Every specialist requires the core skill Unslop when available, may use the core skill Editorial SVG Diagrams, and uses Writing Fragments only when no handoff was supplied. No specialist names its caller or a sibling, and no edge leads into the software engineering tree.</desc>
