  .f-ink { fill: #F1F4F6; }
  .s-ink { stroke: #F1F4F6; }
  .f-muted { fill: #B2BAC1; }
  .s-muted { stroke: #B2BAC1; }
  .f-guide { fill: #49545C; }
  .s-guide { stroke: #49545C; }
  .f-border { fill: #444B50; }
  .s-border { stroke: #444B50; }
  .f-blue { fill: #3979A5; }
  .s-blue { stroke: #3979A5; }
  .f-teal { fill: #137D77; }
