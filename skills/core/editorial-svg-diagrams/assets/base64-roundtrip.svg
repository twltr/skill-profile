<svg xmlns="http://www.w3.org/2000/svg" width="760" height="126" viewBox="0 0 760 126" role="img" aria-labelledby="base64roundtrip-title base64roundtrip-desc">
<title id="base64roundtrip-title">Base64 round trip</title>
<desc id="base64roundtrip-desc">The text Hi! is the three bytes 48 69 21 in UTF-8 and the four characters SGkh in Base64; each step is reversible.</desc>
