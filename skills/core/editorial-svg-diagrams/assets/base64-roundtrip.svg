<defs>
  <marker id="base64roundtrip-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" class="s-blue" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="base64roundtrip-teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" class="s-teal" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="12" y="24" width="180" height="64" rx="10" class="f-neutralwash" />
<rect x="12" y="24" width="180" height="64" rx="10" fill="none" class="s-border" stroke-width="2.2"/>
<text x="102" y="64" class="f-ink label mono" text-anchor="middle" >Hi!</text>
<text x="102" y="114" class="f-muted small" text-anchor="middle" >Text</text>
<rect x="290" y="24" width="180" height="64" rx="10" class="f-bluewash" />
<rect x="290" y="24" width="180" height="64" rx="10" fill="none" class="s-blue" stroke-width="2.2"/>
