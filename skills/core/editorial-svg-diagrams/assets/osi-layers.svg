<svg xmlns="http://www.w3.org/2000/svg" width="595" height="383" viewBox="0 0 595 383" role="img" aria-labelledby="osilayers-title osilayers-desc">
<title id="osilayers-title">OSI layer stack</title>
<desc id="osilayers-desc">Seven OSI layers arranged top to bottom with simple example protocols or responsibilities.</desc>
<style><![CDATA[
  text { font-family: Arial, Helvetica, sans-serif; }
  .label { font-size: 21px; font-weight: 600; }
  .small { font-size: 16px; font-weight: 500; }
  .tiny { font-size: 14px; font-weight: 500; }
  .mono { font-family: Menlo, Consolas, monospace; }
.f-ink { fill: #1C2936; }
