<defs>
  <marker id="osilayers-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" class="s-blue" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="osilayers-teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" class="s-teal" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="14" y="6" width="566" height="45" rx="8" class="f-blue" />
<text x="44" y="36" class="f-whitetxt label" text-anchor="start" >7</text>
<text x="90" y="35" class="f-whitetxt small" text-anchor="start" >Application</text>
<text x="548" y="35" class="f-whitetxt small" text-anchor="end" >HTTP</text>
<rect x="14" y="59" width="566" height="45" rx="8" class="f-blue" />
<text x="44" y="89" class="f-whitetxt label" text-anchor="start" >6</text>
<text x="90" y="88" class="f-whitetxt small" text-anchor="start" >Presentation</text>
<text x="548" y="88" class="f-whitetxt small" text-anchor="end" >Encoding</text>
<rect x="14" y="112" width="566" height="45" rx="8" class="f-blue" />
<text x="44" y="142" class="f-whitetxt label" text-anchor="start" >5</text>
<text x="90" y="141" class="f-whitetxt small" text-anchor="start" >Session</text>
