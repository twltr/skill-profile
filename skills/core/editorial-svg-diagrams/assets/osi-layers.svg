<rect x="14" y="218" width="566" height="45" rx="8" class="f-green" />
<text x="44" y="248" class="f-whitetxt label" text-anchor="start" >3</text>
<text x="90" y="247" class="f-whitetxt small" text-anchor="start" >Network</text>
<text x="548" y="247" class="f-whitetxt small" text-anchor="end" >IP</text>
<rect x="14" y="271" width="566" height="45" rx="8" class="f-ochre" />
<text x="44" y="301" class="f-whitetxt label" text-anchor="start" >2</text>
<text x="90" y="300" class="f-whitetxt small" text-anchor="start" >Data Link</text>
<text x="548" y="300" class="f-whitetxt small" text-anchor="end" >Ethernet</text>
<rect x="14" y="324" width="566" height="45" rx="8" class="f-brown" />
<text x="44" y="354" class="f-whitetxt label" text-anchor="start" >1</text>
<text x="90" y="353" class="f-whitetxt small" text-anchor="start" >Physical</text>
