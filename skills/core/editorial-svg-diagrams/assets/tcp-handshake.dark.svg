<svg xmlns="http://www.w3.org/2000/svg" width="800" height="398" viewBox="0 0 800 398" role="img" aria-labelledby="tcp-title tcp-desc">
<title id="tcp-title">Three-way TCP handshake</title>
<desc id="tcp-desc">Client sends SYN, server responds SYN-ACK, client confirms ACK; server accepts the established connection.</desc>
<style><![CDATA[
  text { font-family: Arial, Helvetica, sans-serif; }
  .label { font-size: 21px; font-weight: 600; }
  .small { font-size: 16px; font-weight: 500; }
  .tiny { font-size: 14px; font-weight: 500; }
  .mono { font-family: Menlo, Consolas, monospace; }
.f-ink { fill: #F1F4F6; }
.s-ink { stroke: #F1F4F6; }
.f-muted { fill: #B2BAC1; }
.s-muted { stroke: #B2BAC1; }
.f-guide { fill: #49545C; }
.s-guide { stroke: #49545C; }
.f-border { fill: #444B50; }
.s-border { stroke: #444B50; }
.f-blue { fill: #3979A5; }
.s-blue { stroke: #3979A5; }
.f-teal { fill: #137D77; }
.s-teal { stroke: #137D77; }
.f-green { fill: #397654; }
.s-green { stroke: #397654; }
.f-ochre { fill: #95622F; }
.s-ochre { stroke: #95622F; }
.f-brown { fill: #8B6058; }
.s-brown { stroke: #8B6058; }
.f-bluewash { fill: #14232E; }
.f-tealwash { fill: #102825; }
.f-greenwash { fill: #14271C; }
.f-neutralwash { fill: #171C20; }
.f-soft { fill: #808990; }
.s-soft { stroke: #808990; }
.f-whitetxt { fill: #FFFFFF; }
]]></style>
<defs>
  <marker id="tcp-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" class="s-blue" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="tcp-teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" class="s-teal" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="146" y="32" class="f-ink label" text-anchor="middle" >Client</text>
<text x="650" y="32" class="f-ink label" text-anchor="middle" >Server</text>
<path d="M146 56 L146 357" fill="none" class="s-guide" stroke-width="2.3" stroke-linecap="round" stroke-dasharray="7 10"/>
<path d="M650 56 L650 357" fill="none" class="s-guide" stroke-width="2.3" stroke-linecap="round" stroke-dasharray="7 10"/>
<rect x="89" y="59" width="114" height="44" rx="10" class="f-blue" />
<text x="146" y="88" class="f-whitetxt small" text-anchor="middle" >connect()</text>
<path d="M146 118 L650 163" fill="none" class="s-blue" stroke-width="3.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tcp-blue-arrow)" />
<text x="380" y="124" class="f-ink label" text-anchor="middle" >SYN</text>
<path d="M650 190 L146 235" fill="none" class="s-teal" stroke-width="3.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tcp-teal-arrow)" />
<text x="390" y="185" class="f-ink label" text-anchor="middle" >SYN-ACK</text>
<path d="M146 270 L650 315" fill="none" class="s-blue" stroke-width="3.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#tcp-blue-arrow)" />
<text x="390" y="265" class="f-ink label" text-anchor="middle" >ACK</text>
<rect x="587" y="336" width="126" height="43" rx="10" class="f-teal" />
<text x="650" y="363" class="f-whitetxt small" text-anchor="middle" >accept()</text>
</svg>
