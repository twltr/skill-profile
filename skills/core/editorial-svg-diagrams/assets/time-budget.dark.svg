<svg xmlns="http://www.w3.org/2000/svg" width="640" height="216" viewBox="0 0 640 216" role="img" aria-labelledby="timebudget-title timebudget-desc">
<title id="timebudget-title">Where page load time goes</title>
<desc id="timebudget-desc">Page load of 1.8 seconds split proportionally: network 0.9 s, render 0.6 s, script 0.3 s. Values are illustrative.</desc>
<style><![CDATA[
  text { font-family: Arial, Helvetica, sans-serif; }
  .label { font-size: 21px; font-weight: 600; }
  .small { font-size: 16px; font-weight: 500; }
  .tiny { font-size: 14px; font-weight: 500; }
  .mono { font-family: Menlo, Consolas, monospace; }
.f-ink { fill: #F1F4F6; }
.s-ink { stroke: #F1F4F6; }
.f-muted { fill: #B2BAC1; }
.s-muted { stroke: #B2BAC1; }
.f-guide { fill: #49545C; }
.s-guide { stroke: #49545C; }
.f-border { fill: #444B50; }
.s-border { stroke: #444B50; }
.f-blue { fill: #3979A5; }
.s-blue { stroke: #3979A5; }
.f-teal { fill: #137D77; }
.s-teal { stroke: #137D77; }
.f-green { fill: #397654; }
.s-green { stroke: #397654; }
.f-ochre { fill: #95622F; }
.s-ochre { stroke: #95622F; }
.f-brown { fill: #8B6058; }
.s-brown { stroke: #8B6058; }
.f-bluewash { fill: #14232E; }
.f-tealwash { fill: #102825; }
.f-greenwash { fill: #14271C; }
.f-neutralwash { fill: #171C20; }
.f-soft { fill: #808990; }
.s-soft { stroke: #808990; }
.f-whitetxt { fill: #FFFFFF; }
]]></style>
<defs>
  <marker id="timebudget-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" class="s-blue" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="timebudget-teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" class="s-teal" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="12" y="34" class="f-muted small" text-anchor="start" >Page load</text>
<text x="628" y="36" class="f-ink label" text-anchor="end" style="font-size:30px;font-weight:700">1.8 s</text>
<rect x="12" y="54" width="305.0" height="30" rx="6" class="f-blue" />
<rect x="12" y="112" width="14" height="14" rx="3" class="f-blue" />
<text x="38" y="126" class="f-ink label" text-anchor="start" >Network</text>
<text x="628" y="126" class="f-ink label" text-anchor="end" >0.9 s</text>
<rect x="320.0" y="54" width="202.3" height="30" rx="6" class="f-teal" />
<rect x="12" y="150" width="14" height="14" rx="3" class="f-teal" />
<text x="38" y="164" class="f-ink label" text-anchor="start" >Render</text>
<text x="628" y="164" class="f-ink label" text-anchor="end" >0.6 s</text>
<rect x="525.3" y="54" width="99.7" height="30" rx="6" class="f-ochre" />
<rect x="12" y="188" width="14" height="14" rx="3" class="f-ochre" />
<text x="38" y="202" class="f-ink label" text-anchor="start" >Script</text>
<text x="628" y="202" class="f-ink label" text-anchor="end" >0.3 s</text>
</svg>
