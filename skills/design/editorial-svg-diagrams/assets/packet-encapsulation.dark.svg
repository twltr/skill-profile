<svg xmlns="http://www.w3.org/2000/svg" width="834" height="351" viewBox="0 0 834 351" role="img" aria-labelledby="packetencapsulation-title packetencapsulation-desc">
<title id="packetencapsulation-title">Packet encapsulation</title>
