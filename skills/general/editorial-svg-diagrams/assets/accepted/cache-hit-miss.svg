<marker id="cache-path-teal-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" class="s-teal" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="cache-path-guide-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" class="s-muted" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
