<svg xmlns="http://www.w3.org/2000/svg" width="870" height="396" viewBox="0 0 870 396" role="img" aria-labelledby="cache-path-title cache-path-desc">
<title id="cache-path-title">Cache hit and cache miss</title>
<desc id="cache-path-desc">Cache hit: request returns from cache without visiting the database. Cache miss: request continues to the database and its response returns via cache.</desc>
<style><![CDATA[
    text { font-family: Arial, Helvetica, sans-serif; font-weight: 500; }
    .label { font-size: 22px; font-weight: 600; }
    .small { font-size: 18px; font-weight: 600; }
    .number { font-size: 24px; font-weight: 600; }
    .chip-number { font-size: 27px; font-weight: 700; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .f-ink { fill: #263340; } .s-ink { stroke: #263340; }
    .f-muted { fill: #657381; } .s-muted { stroke: #657381; }
    .s-guide { stroke: #C9D3DA; } .s-faint { stroke: #DCE3E8; }
    .f-blue { fill: #397DA9; } .s-blue { stroke: #397DA9; }
    .f-teal { fill: #0F8E86; } .s-teal { stroke: #0F8E86; }
    .f-bluewash { fill: #EAF2F9; } .f-tealwash { fill: #E0F4F0; }
    .f-whitetxt { fill: #FFFFFF; }

@media (prefers-color-scheme: dark) {
    text { font-family: Arial, Helvetica, sans-serif; font-weight: 500; }
    .label { font-size: 22px; font-weight: 600; }
    .small { font-size: 18px; font-weight: 600; }
    .number { font-size: 24px; font-weight: 600; }
    .chip-number { font-size: 27px; font-weight: 700; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .f-ink { fill: #EEF3F6; } .s-ink { stroke: #EEF3F6; }
    .f-muted { fill: #AEBAC2; } .s-muted { stroke: #AEBAC2; }
    .s-guide { stroke: #4A555F; } .s-faint { stroke: #303B43; }
    .f-blue { fill: #528FB9; } .s-blue { stroke: #528FB9; }
    .f-teal { fill: #1DA8A0; } .s-teal { stroke: #1DA8A0; }
    .f-bluewash { fill: #172A39; } .f-tealwash { fill: #142F2C; }
    .f-whitetxt { fill: #FFFFFF; }
    }
]]></style>
<defs>
