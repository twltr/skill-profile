<svg xmlns="http://www.w3.org/2000/svg" width="787" height="221" viewBox="0 0 787 221" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">Simple client API database architecture</title>
<desc id="arch-desc">Client uses HTTP to talk with an API; the API uses SQL with a database. This figure is fictional and illustrative.</desc>
