<rect x="551" y="375" width="125" height="29" rx="5" fill="#E9F3F6"/>
<text x="613" y="395" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#172738">calls</text>
<path d="M 718 470 H 770 V 375 H 792" fill="none" stroke="#3E805C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)"/>
<rect x="728" y="329" width="58" height="31" rx="5" fill="#F7F9FC"/>
<text x="757" y="351" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#172738">SQL</text>
<rect x="52" y="598" width="996" height="77" rx="12" fill="#FFFFFF" stroke="#D5DFE7" stroke-width="1.5"/>
<text x="77" y="629" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#172738">Read the boundaries carefully</text>
<text x="77" y="657" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#566779">Modules are logical units here; the API and service are NOT separate deployments.</text></svg>
