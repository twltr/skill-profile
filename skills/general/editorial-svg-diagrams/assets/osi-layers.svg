<text x="157" y="356" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#FFFFFF">Session  /  Sitzung</text>
<text x="157" y="381" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#F2F8FA">Session management concepts</text>
<rect x="56" y="408" width="888" height="79" rx="12" fill="#237C77"/>
<rect x="68" y="420" width="64" height="55" rx="9" fill="#FFFFFF" opacity="0.14"/>
