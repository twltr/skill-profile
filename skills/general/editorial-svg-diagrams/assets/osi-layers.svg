<text x="157" y="443" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#FFFFFF">Transport  /  Transportebene</text>
<text x="157" y="468" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#F2F8FA">TCP  |  UDP</text>
