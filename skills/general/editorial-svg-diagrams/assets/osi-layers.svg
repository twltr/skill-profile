<text x="157" y="530" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#FFFFFF">Network  /  Vermittlung</text>
<text x="157" y="555" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#F2F8FA">IPv4  |  IPv6  |  ICMP</text>
<rect x="56" y="582" width="888" height="79" rx="12" fill="#986934"/>
<rect x="68" y="594" width="64" height="55" rx="9" fill="#FFFFFF" opacity="0.14"/>
<text x="100" y="631" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<text x="157" y="617" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#FFFFFF">Data Link  /  Sicherung</text>
<text x="157" y="642" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#F2F8FA">Ethernet  |  WLAN-MAC</text>
<rect x="56" y="669" width="888" height="79" rx="12" fill="#805B53"/>
<rect x="68" y="681" width="64" height="55" rx="9" fill="#FFFFFF" opacity="0.14"/>
<text x="100" y="718" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
<text x="157" y="704" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#FFFFFF">Physical  /  Bitübertragung</text>
<text x="157" y="729" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#F2F8FA">Copper  |  optical fiber  |  radio</text>
<text x="56" y="789" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#566779">Conceptual teaching model; real protocol stacks do not map perfectly to seven layers.</text></svg>
