<text x="157" y="182" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#FFFFFF">Application  /  Anwendung</text>
<text x="157" y="207" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#F2F8FA">HTTP  |  DNS  |  SMTP</text>
<rect x="56" y="234" width="888" height="79" rx="12" fill="#337193"/>
<rect x="68" y="246" width="64" height="55" rx="9" fill="#FFFFFF" opacity="0.14"/>
<text x="100" y="283" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#FFFFFF">6</text>
<text x="157" y="269" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#FFFFFF">Presentation  /  Darstellung</text>
<text x="157" y="294" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#F2F8FA">Encoding  |  encryption concepts</text>
<rect x="56" y="321" width="888" height="79" rx="12" fill="#407E9A"/>
<rect x="68" y="333" width="64" height="55" rx="9" fill="#FFFFFF" opacity="0.14"/>
