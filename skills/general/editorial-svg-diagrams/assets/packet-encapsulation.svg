<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="811" viewBox="0 0 1040 811" role="img" aria-labelledby="encap-title encap-desc">
<title id="encap-title">Protocol encapsulation</title>
<desc id="encap-desc">Four rows show application data, a TCP segment, an IP packet, and an Ethernet frame with Ethernet FCS.</desc>
<defs>
      <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M1 1 L9 5 L1 9Z" fill="#356F9F"/>
      </marker>
      <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M1 1 L9 5 L1 9Z" fill="#237C77"/>
      </marker>
      <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M1 1 L9 5 L1 9Z" fill="#3E805C"/>
      </marker>
    </defs>
<rect x="0" y="0" width="1040" height="811" rx="0" fill="#F7F9FC"/>
<text x="56" y="42" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#356F9F">STRUCTURE DIAGRAM</text>
<text x="56" y="85" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#172738">How packets are encapsulated</text>
<text x="56" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#566779">Each lower layer wraps the higher-layer payload with its own information.</text><rect x="56" y="146" width="928" height="128" rx="12" fill="#FFFFFF" stroke="#D5DFE7" stroke-width="1.5"/>
<text x="76" y="178" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#566779">01   APPLICATION DATA</text>
<rect x="76" y="199" width="892" height="58" rx="7" fill="#356F9F"/>
<text x="522.0" y="235" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">Payload: Hallo</text>
<rect x="56" y="290" width="928" height="128" rx="12" fill="#FFFFFF" stroke="#D5DFE7" stroke-width="1.5"/>
<text x="76" y="322" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#566779">02   TCP SEGMENT</text>
<rect x="76" y="343" width="252" height="58" rx="7" fill="#237C77"/>
<text x="202.0" y="379" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">TCP header</text>
<rect x="328" y="343" width="640" height="58" rx="7" fill="#356F9F"/>
<text x="648.0" y="379" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">Payload: Hallo</text>
<rect x="56" y="434" width="928" height="128" rx="12" fill="#FFFFFF" stroke="#D5DFE7" stroke-width="1.5"/>
<text x="76" y="466" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#566779">03   IP PACKET</text>
<rect x="76" y="487" width="184" height="58" rx="7" fill="#3E805C"/>
<text x="168.0" y="523" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">IP header</text>
<rect x="260" y="487" width="238" height="58" rx="0" fill="#237C77"/>
<text x="379.0" y="523" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">TCP header</text>
<rect x="498" y="487" width="470" height="58" rx="7" fill="#356F9F"/>
<text x="733.0" y="523" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">Payload: Hallo</text>
<rect x="56" y="578" width="928" height="128" rx="12" fill="#FFFFFF" stroke="#D5DFE7" stroke-width="1.5"/>
<text x="76" y="610" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#566779">04   ETHERNET FRAME</text>
<rect x="76" y="631" width="171" height="58" rx="7" fill="#A67637"/>
<text x="161.5" y="667" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">Eth. header</text>
<rect x="247" y="631" width="155" height="58" rx="0" fill="#3E805C"/>
<text x="324.5" y="667" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">IP header</text>
<rect x="402" y="631" width="205" height="58" rx="0" fill="#237C77"/>
<text x="504.5" y="667" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">TCP header</text>
<rect x="607" y="631" width="235" height="58" rx="0" fill="#356F9F"/>
<text x="724.5" y="667" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">Payload</text>
<rect x="842" y="631" width="126" height="58" rx="7" fill="#815B53"/>
<text x="905.0" y="667" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">FCS</text>
<text x="58" y="755" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#566779">Widths are schematic, not proportional to header sizes in bytes.</text>
<text x="58" y="779" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#566779">At the receiver, each layer interprets and removes its corresponding envelope.</text></svg>
