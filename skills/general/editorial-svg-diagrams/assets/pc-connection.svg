<path d="M653 94 L653 104" fill="none" class="s-blue" stroke-width="3" stroke-linecap="round" />
<path d="M637 104 L669 104" fill="none" class="s-blue" stroke-width="3" stroke-linecap="round" />
<text x="653" y="139" class="f-ink label" text-anchor="middle" >PC Y</text>
<text x="653" y="174" class="f-muted small mono" text-anchor="middle" >192.168.1.20</text>
<text x="653" y="203" class="f-muted small" text-anchor="middle" >Port 53124</text>
<path d="M556 100 H219" fill="none" class="s-teal" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#endpoint-teal-arrow)" />
<text x="384" y="87" class="f-ink small" text-anchor="middle" >connect</text>
<path d="M219 170 H556" fill="none" class="s-blue" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#endpoint-blue-arrow)" stroke-dasharray="6 7"/>
<text x="384" y="160" class="f-ink small" text-anchor="middle" >Antwort</text>
</svg>
