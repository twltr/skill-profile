<svg xmlns="http://www.w3.org/2000/svg" width="665" height="213" viewBox="0 0 665 213" role="img" aria-labelledby="starter-title starter-desc">
<title id="starter-title">Minimal two-node figure</title>
<desc id="starter-desc">A sender points to a receiver. Minimal labels, transparent background, no title inside the visible diagram.</desc>
<style><![CDATA[
  text { font-family: Arial, Helvetica, sans-serif; }
  .label { font-size: 21px; font-weight: 600; }
  .small { font-size: 16px; font-weight: 500; }
  .tiny { font-size: 14px; font-weight: 500; }
  .mono { font-family: Menlo, Consolas, monospace; }
.f-ink { fill: #F1F4F6; }
.s-ink { stroke: #F1F4F6; }
.f-muted { fill: #B2BAC1; }
.s-muted { stroke: #B2BAC1; }
.f-guide { fill: #49545C; }
.s-guide { stroke: #49545C; }
.f-border { fill: #444B50; }
.s-border { stroke: #444B50; }
.f-blue { fill: #3979A5; }
.s-blue { stroke: #3979A5; }
.f-teal { fill: #137D77; }
.s-teal { stroke: #137D77; }
.f-green { fill: #397654; }
.s-green { stroke: #397654; }
.f-ochre { fill: #95622F; }
.s-ochre { stroke: #95622F; }
.f-brown { fill: #8B6058; }
.s-brown { stroke: #8B6058; }
.f-bluewash { fill: #14232E; }
.f-tealwash { fill: #102825; }
.f-greenwash { fill: #14271C; }
.f-neutralwash { fill: #171C20; }
.f-soft { fill: #808990; }
.s-soft { stroke: #808990; }
.f-whitetxt { fill: #FFFFFF; }
]]></style>
<defs>
  <marker id="starter-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" class="s-blue" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="starter-teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" class="s-teal" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="14" y="57" width="205" height="99" rx="12" class="f-bluewash" />
<rect x="446" y="57" width="205" height="99" rx="12" class="f-tealwash" />
<rect x="14" y="57" width="205" height="99" rx="12" fill="none" class="s-blue" stroke-width="2.4"/>
<rect x="446" y="57" width="205" height="99" rx="12" fill="none" class="s-teal" stroke-width="2.4"/>
<text x="116" y="113" class="f-ink label" text-anchor="middle" >Sender</text>
<text x="548" y="113" class="f-ink label" text-anchor="middle" >Receiver</text>
<path d="M219 106 H445" fill="none" class="s-blue" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#starter-blue-arrow)" />
</svg>
