<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475" role="img" aria-labelledby="starter-title starter-desc">
<title id="starter-title">Minimal diagram starter</title>
<desc id="starter-desc">Two labeled rounded boxes connected by a directional arrow.</desc>
<defs>
      <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M1 1 L9 5 L1 9Z" fill="#356F9F"/>
      </marker>
      <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M1 1 L9 5 L1 9Z" fill="#237C77"/>
      </marker>
      <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M1 1 L9 5 L1 9Z" fill="#3E805C"/>
      </marker>
    </defs>
<rect x="0" y="0" width="960" height="475" rx="0" fill="#F7F9FC"/>
<text x="56" y="42" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#356F9F">EDITABLE TEMPLATE</text>
<text x="56" y="85" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#172738">A clear idea, one arrow</text>
<text x="56" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#566779">Change labels and coordinates; keep the SVG valid and portable.</text><rect x="70" y="190" width="320" height="150" rx="12" fill="#FFFFFF" stroke="#D5DFE7" stroke-width="1.5"/>
