<text x="98" y="288" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#566779">An input, actor or module</text>
<rect x="570" y="190" width="320" height="150" rx="12" fill="#FFFFFF" stroke="#D5DFE7" stroke-width="1.5"/>
<rect x="570" y="190" width="320" height="10" rx="4" fill="#237C77"/>
<text x="598" y="250" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#172738">Destination</text>
