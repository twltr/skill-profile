<text x="480" y="250" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#172738">sends</text>
<text x="70" y="412" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#566779">This is pure SVG markup: editable text, reusable shapes, no external fonts or assets.</text></svg>
